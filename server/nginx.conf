# ─────────────────────────────────────────────────────────────────────────────
# Barcode Scanner License Server — nginx snippet
#
# PASTE this inside your existing  server { ... }  block in:
#   /etc/nginx/sites-available/your-site
#   (or wherever your other apps' nginx config lives)
#
# The Flask app runs internally on port 8765 (set PORT=8765 in .env).
# Nginx routes  /barcode-scanner/  →  127.0.0.1:8765  (no extra firewall rule needed).
#
# After pasting, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

    location /barcode-scanner/ {
        proxy_pass         http://127.0.0.1:8765/;
        proxy_http_version 1.1;

        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;

        # Tells Flask its URL prefix so redirects and url_for() work correctly
        proxy_set_header   X-Script-Name       /barcode-scanner;

        proxy_read_timeout 30s;
    }


# ─────────────────────────────────────────────────────────────────────────────
# RESULT after adding this:
#
#   Admin UI  →  https://your-domain.com/barcode-scanner/
#   App API   →  https://your-domain.com/barcode-scanner/api/status
#
# In Android app's build.gradle set:
#   LICENSE_SERVER_URL = "https://your-domain.com/barcode-scanner"
#
# ─────────────────────────────────────────────────────────────────────────────


